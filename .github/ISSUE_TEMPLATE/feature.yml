name: 💡 Idea / Funzionalità
description: Proponi un miglioramento · Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Di cosa hai bisogno in campo? · What do you need on the pitch?
      description: Descrivi la situazione da allenatore, non solo la soluzione · Describe the coaching situation, not only the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Come te lo immagini · How you picture it
