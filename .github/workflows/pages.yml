name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # With a custom domain (repository variable PAGES_DOMAIN, e.g. diagonalecalcio.it) the site is served
      # at the domain root; otherwise at https://<user>.github.io/<repo>/.
      - name: Resolve base path
        run: |
          if [ -n "${{ vars.PAGES_DOMAIN }}" ]; then
            echo "BASE_PATH=/app/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ vars.PAGES_DOMAIN }}/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/app/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - name: Build web app
        run: pnpm --filter @diagonale/web build
        env:
          # optional cloud features (Supabase): set these as repository variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Assemble landing site + app
        run: node scripts/build-site.mjs
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
