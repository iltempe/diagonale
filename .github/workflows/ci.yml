name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: i18n keys (it ↔ en)
        run: pnpm check:i18n
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build MCP server
        run: pnpm --filter @diagonale/mcp-server build
      - name: Desktop main process parses
        run: node --check apps/desktop/main.cjs && node --check apps/desktop/preload.cjs
      - name: Generated data is up to date
        run: pnpm gen:data && git diff --exit-code data/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @diagonale/web exec playwright install --with-deps chromium
      - run: pnpm --filter @diagonale/web e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
